// arma3-mcp -- dedicated server test environment config.
//
// Modelled on arma_llm_commander (ALC) server-side practice:
//   1. the task is declared via class Missions together with -autoInit, rather
//      than passing -mission= on the command line. The latter only works for
//      persistent missions; otherwise the server skips it silently
//      ("Autolnit is supported only for persistent missions!").
//   2. the task lives under <profiles>/mpmissions/, which is where the server
//      looks for it.
//   3. stdout must be redirected to a file -- a dedicated server has no UI, so
//      without a log there is nothing to look at.
//
// Pure ASCII on purpose: this file is read by the engine, and comments in a
// non-ASCII codepage are one more thing that can go wrong for no benefit.

hostname = "arma3-mcp P3 test";
password = "";
maxPlayers = 2;
// persistent = 1 is REQUIRED for -autoInit to take effect. The server says so
// itself ("Autolnit is supported only for persistent missions!") and skips the
// flag otherwise -- which is exactly why the mission never loaded here. I read
// that line early on and failed to connect it to this setting.
persistent = 1;

// BattlEye off: this environment is for protocol work, not for hosting players.
// BE adds a second moving part (and its own directory of state) to every startup
// without contributing anything to what is being tested here.
BattlEye = 0;

class Missions
{
    class mcp_test
    {
        template = "mcp_test.Altis";
        difficulty = "Regular";
    };
};
